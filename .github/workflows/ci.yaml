name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  filter:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      docs_only: ${{ steps.decide.outputs.docs_only }}
    steps:
      - name: Decide docs-only
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          docs_only=false
          if [ "$EVENT_NAME" = "pull_request" ]; then
            files=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" --jq '.[].filename')
            total=$(grep -c . <<< "$files" || true)
            docs=$(grep -cE '\.md$|^docs/' <<< "$files" || true)
            if [ "$total" -gt 0 ] && [ "$docs" -eq "$total" ]; then
              docs_only=true
            fi
          fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

  validate:
    needs: filter
    runs-on: ubuntu-latest
    steps:
      - name: Report docs-only skip
        if: needs.filter.outputs.docs_only == 'true'
        run: echo "Skipped: docs-only change" >> "$GITHUB_STEP_SUMMARY"
      - name: Checkout
        if: needs.filter.outputs.docs_only != 'true'
        uses: actions/checkout@v6
      - name: Set up Node
        if: needs.filter.outputs.docs_only != 'true'
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        if: needs.filter.outputs.docs_only != 'true'
        run: npm ci
      - name: Typecheck
        if: needs.filter.outputs.docs_only != 'true'
        run: npm run typecheck
      - name: Lint
        if: needs.filter.outputs.docs_only != 'true'
        run: npm run lint
      - name: Test
        if: needs.filter.outputs.docs_only != 'true'
        run: npm test
      - name: Build
        if: needs.filter.outputs.docs_only != 'true'
        run: npm run build
