name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      # Shadow database for `prisma migrate diff --from-migrations`.
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
      # Every action must be pinned to a full commit SHA (see build.yaml).
      - name: Check actions are pinned to commit SHAs
        run: |
          unpinned=$(grep -rnE '^\s*(-\s*)?uses:' .github/workflows | grep -vE 'uses:\s+[^@[:space:]]+@[0-9a-f]{40}(\s|$)' || true)
          if [ -n "$unpinned" ]; then
            echo "These actions are not pinned to a 40-hex commit SHA:"
            echo "$unpinned"
            exit 1
          fi
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      # Applies every migration to the shadow database and fails if the result
      # differs from the schema, printing the missing SQL.
      - name: Check migrations match schema
        env:
          # The schema engine exits silently without a datasource; it doesn't connect.
          DATABASE_URL: postgresql://unused@localhost/unused
          SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: npx prisma migrate diff --from-migrations prisma/migrations --to-schema prisma/schema.prisma --script --exit-code
