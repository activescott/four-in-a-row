name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      # Shadow database for `prisma migrate diff --from-migrations`.
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Every action must be pinned to a full commit SHA (see build.yaml).
      - name: Check actions are pinned to commit SHAs
        run: |
          unpinned=$(grep -rnE '^\s*(-\s*)?uses:' .github/workflows | grep -vE 'uses:\s+[^@[:space:]]+@[0-9a-f]{40}(\s|$)' || true)
          if [ -n "$unpinned" ]; then
            echo "These actions are not pinned to a 40-hex commit SHA:"
            echo "$unpinned"
            exit 1
          fi
      # The e2e job's container image must be the @playwright/test version in
      # package-lock.json, or its browsers don't match.
      - name: Check Playwright image matches @playwright/test
        run: npm run check:playwright-image
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      # Prisma's CLI phones home to checkpoint.prisma.io unless told not to;
      # fails if `prisma generate` still does with CHECKPOINT_DISABLE unset.
      - name: Check Prisma does not call checkpoint
        run: npm run check:no-checkpoint
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      # Applies every migration to the shadow database and fails if the result
      # differs from the schema, printing the missing SQL.
      - name: Check migrations match schema
        env:
          # The schema engine exits silently without a datasource; it doesn't connect.
          DATABASE_URL: postgresql://unused@localhost/unused
          SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: npx prisma migrate diff --from-migrations prisma/migrations --to-schema prisma/schema.prisma --script --exit-code

  # Two players in separate browser contexts: sign-in by email link, an invite,
  # and a game played to a win, in mobile WebKit, desktop Chromium and desktop
  # Firefox. Playwright starts the production build (`npm start`) with
  # E2E_TEST_MODE, so mail is captured and read back, never sent.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Browsers and their system packages are in the image, so no apt install on
    # each run. Keep the tag equal to @playwright/test in package-lock.json
    # (checked by `npm run check:playwright-image`; Renovate bumps both together).
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble@sha256:1507cbfc550a63a6b7396791ca4f00df17beb56342d2447b3f106c306f525579
    services:
      postgres:
        image: postgres:18-alpine@sha256:b6972e1115a4ff8eba5d7f7d19184926d1e16d7d1136ae1e1a7ebf286da0f015
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s
          --health-retries 10
    env:
      # In a container job the service is reached by its service name.
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/postgres
      # Firefox refuses a HOME owned by another user.
      HOME: /root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Apply migrations
        run: npx prisma migrate deploy
      - name: Build
        run: npm run build
      - name: Run end-to-end tests
        run: npx playwright test
      - name: Upload report and traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
