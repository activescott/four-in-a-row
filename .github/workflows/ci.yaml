name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      # shortcut: compares only the first migration with Prisma's own SQL; switch
      # to `migrate diff --from-migrations` with a shadow database at the second.
      - name: Check migration matches schema
        env:
          DEBUG: "prisma*"
        run: |
          npx prisma migrate diff --from-empty --to-schema prisma/schema.prisma --script > "$RUNNER_TEMP/expected.sql"
          echo "migrate diff exit: $?"
          cat "$RUNNER_TEMP/expected.sql"
          diff -u "$RUNNER_TEMP/expected.sql" prisma/migrations/20261113000000_init/migration.sql
