name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  filter:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      docs_only: ${{ steps.decide.outputs.docs_only }}
    steps:
      - name: Classify changed paths
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        with:
          list-files: json
          filters: |
            docs:
              - "**/*.md"
              - "docs/**"
            all:
              - "**"
      - name: Decide docs-only
        id: decide
        env:
          DOCS_FILES: ${{ steps.filter.outputs.docs_files }}
          ALL_FILES: ${{ steps.filter.outputs.all_files }}
        run: |
          docs_count=$(jq 'length' <<< "${DOCS_FILES:-[]}")
          all_count=$(jq 'length' <<< "${ALL_FILES:-[]}")
          if [ "$all_count" -gt 0 ] && [ "$docs_count" -eq "$all_count" ]; then
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi

  validate:
    needs: filter
    runs-on: ubuntu-latest
    steps:
      - name: Report docs-only skip
        if: needs.filter.outputs.docs_only == 'true'
        run: echo "Skipped: docs-only change" >> "$GITHUB_STEP_SUMMARY"
      - name: Checkout
        if: needs.filter.outputs.docs_only != 'true'
        uses: actions/checkout@v7
      - name: Set up Node
        if: needs.filter.outputs.docs_only != 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        if: needs.filter.outputs.docs_only != 'true'
        run: npm ci
      - name: Typecheck
        if: needs.filter.outputs.docs_only != 'true'
        run: npm run typecheck
      - name: Lint
        if: needs.filter.outputs.docs_only != 'true'
        run: npm run lint
      - name: Test
        if: needs.filter.outputs.docs_only != 'true'
        run: npm test
      - name: Build
        if: needs.filter.outputs.docs_only != 'true'
        run: npm run build
